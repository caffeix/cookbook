<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block meta_description %}Your personal recipe collection.{% endblock %}">
  <meta name="theme-color" content="#EAF3F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1615" media="(prefers-color-scheme: dark)">

  <title>{% block title %}Cooksique{% endblock %}</title>

  <!-- Design system tokens (always first) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">

  <!-- Per-page stylesheet slot -->
  {% block head %}{% endblock %}

  <!-- Dark mode: apply saved preference before first paint to avoid FOUC -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  {% block body %}
  <div class="page-wrapper">
    <!-- ── Global nav ─────────────────────────────────────────────────── -->
    <nav class="app-nav" id="appNav" aria-label="Main navigation">
      <span class="app-nav__title">
        Cooksiq<span class="app-nav__title-accent">ue</span>
      </span>
      <button class="app-nav__toggle" id="darkModeToggle" aria-label="Toggle dark mode" type="button">
        <!-- Moon — shown in light mode -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <!-- Sun — shown in dark mode -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      </button>
    </nav>

    <!-- ── Page content ───────────────────────────────────────────────── -->
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  {% endblock %}

  <!-- Per-page script slot -->
  {% block scripts %}{% endblock %}

  <!-- Dark mode toggle script (global) -->
  <script>
    (function () {
      var btn = document.getElementById('darkModeToggle');
      var nav = document.getElementById('appNav');
      if (!btn) return;

      btn.addEventListener('click', function () {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });

      // Subtle nav separator on scroll
      if (nav) {
        window.addEventListener('scroll', function () {
          nav.classList.toggle('app-nav--scrolled', window.scrollY > 4);
        }, { passive: true });
      }
    })();
  </script>
</body>

</html>
